const stages=[
{title:'โรงงานกำเนิดคลื่น',sub:'สร้างเสียง • อ่านคลื่น • ส่งสัญญาณ',icon:'∿',story:'เครื่องส่งสารของเมืองหยุดทำงาน เรโซต้องการวิศวกรที่เข้าใจการสั่นของอากาศ เพื่อเปิดระบบสื่อสารอีกครั้ง',badge:'นักสำรวจคลื่น',color:'#66e4dc',quests:[
{id:'a1',title:'ปลุกอนุภาคอากาศ',lab:'particle',brief:'ลากความถี่และแอมพลิจูด สังเกตอนุภาคสีส้มที่ถูกติดตาม แล้วบันทึกหลักฐาน',target:'ตั้งความถี่ 4 Hz และแอมพลิจูด 16 หน่วยภาพ',controls:[range('f','ความถี่ภาพช้า',1,6,1,2,'Hz'),range('a','แอมพลิจูด',4,22,1,8,'หน่วยภาพ')],check:s=>s.f===4&&s.a===16,q:Q('ขณะเสียงเคลื่อนที่ อนุภาคอากาศเคลื่อนอย่างไร?',['เดินทางจากลำโพงถึงผู้ฟังพร้อมคลื่น','สั่นไป–กลับขนานทิศการเคลื่อนที่ของคลื่น','สั่นตั้งฉากกับทิศการเคลื่อนที่ของคลื่น'],1,'เสียงในอากาศเป็นคลื่นตามยาว อนุภาคสั่นรอบตำแหน่งสมดุล ขณะที่พลังงานถ่ายทอดต่อกัน'),hint:'ติดตามจุดสีส้มและตำแหน่งสมดุลที่ทำเครื่องหมายไว้',note:'แบบจำลองเชิงแนวคิด: ความถี่ภาพ 1–6 Hz ใช้สังเกต ไม่ใช่เสียงที่เปิดจริง'},
{id:'a2',title:'อ่านสองกราฟ',lab:'phase',brief:'เปรียบเทียบการกระจัดกับความดันส่วนเกิน ณ เวลาเดียวกัน เลื่อนตำแหน่งตรวจวัดไปที่หนึ่งในสี่ความยาวคลื่น',target:'ตั้งตำแหน่งตรวจวัด x/λ = 0.25',controls:[range('x','ตำแหน่ง x/λ',0,1,.05,0,'')],check:s=>Math.abs(s.x-.25)<.001,q:Q('ที่ x/λ = 0.25 ของภาพนี้ การกระจัดและความดันส่วนเกินเป็นอย่างไร?',['การกระจัดมากสุด ความดันส่วนเกินเป็นศูนย์','ทั้งสองมีค่ามากสุดพร้อมกัน','การกระจัดเป็นศูนย์ ความดันมากสุด'],0,'ภาพใช้ ξ=A sin(kx), Δp=−B cos(kx) จึงต่างเฟส π/2 กราฟคือค่าตามตำแหน่ง ไม่ใช่ทางเดินขึ้น–ลงของอนุภาค'),hint:'มองจุดบนเส้นประแนวตั้งของกราฟทั้งสอง กราฟความดันใช้แกนมาตรฐาน Δp/B',note:'ภาพ ณ เวลาอ้างอิงเดียวกัน · ξ/A = sin(2πx/λ), Δp/B = −cos(2πx/λ)'},
{id:'a3',title:'รหัสอุณหภูมิ',lab:'travel',brief:'ปรับอุณหภูมิและความถี่ เพื่อส่งรหัสที่มีความยาวคลื่น 0.50 เมตร',target:'อุณหภูมิ 25 °C และความถี่ 692 Hz',controls:[range('T','อุณหภูมิอากาศ',0,40,1,10,'°C'),range('f','ความถี่',300,800,1,500,'Hz')],check:s=>s.T===25&&s.f===692,n:N('ความยาวคลื่นของเสียงนี้เท่าใด?',.5,.005,'m','v ≈ 331 + 0.6(25) = 346 m/s และ λ = v/f = 346/692 = 0.50 m'),q:Q('เมื่ออุณหภูมิสูงขึ้น แต่ความถี่แหล่งกำเนิดคงเดิม จะเกิดอะไร?',['อัตราเร็วลด ความยาวคลื่นลด','อัตราเร็วเพิ่ม ความยาวคลื่นเพิ่ม','อัตราเร็วเพิ่ม ความถี่เพิ่มเสมอ'],1,'อัตราเร็วเสียงในอากาศเพิ่มตามอุณหภูมิ เมื่อ f คงเดิม λ=v/f จึงเพิ่ม'),hint:'ใช้ v ≈ 331 + 0.6T แล้วแทนใน λ=v/f',note:'สูตรอัตราเร็วเป็นค่าประมาณสำหรับอากาศในช่วงอุณหภูมิใกล้สภาวะทั่วไป'}]},
{title:'เขาวงกตเสียงสะท้อน',sub:'สะท้อน • หักเห • แทรกสอด • เลี้ยวเบน',icon:'⌁',story:'หุ่นยนต์สำรวจติดอยู่ในทางเดินมืด ใช้สมบัติคลื่นเปิดเผยกำแพงและส่งสัญญาณอ้อมสิ่งกีดขวาง',badge:'ผู้พิชิตเขาวงกต',color:'#b9a0ff',quests:[
{id:'b1',title:'ค้นหากำแพง',lab:'echo',brief:'เครื่องจับเวลาวัดเสียงสะท้อนกลับได้ 0.40 s ในอากาศที่ v=340 m/s ปักหมุดกำแพงให้ตรงกับหลักฐาน',target:'ปรับระยะกำแพงให้เวลาไป–กลับเท่ากับ 0.40 s',controls:[range('d','ระยะกำแพง',10,100,1,40,'m')],check:s=>s.d===68,n:N('กำแพงห่างจากเครื่องส่งเท่าใด?',68,.1,'m','d = vt/2 = 340×0.40/2 = 68 m ต้องหารสองเพราะเสียงเดินทางไปและกลับ'),q:Q('เพราะเหตุใดจึงหารเวลาเดินทางด้วยสอง?',['อัตราเร็วเสียงลดลงครึ่งหนึ่ง','เสียงมีสองความถี่','เวลาที่วัดรวมการเดินทางไปและกลับ'],2,'ระยะทางรวมของเสียงคือ 2d จึงได้ t=2d/v'),hint:'ระยะทางไป–กลับเป็นสองเท่าของระยะถึงกำแพง',note:'สมมติผนังสะท้อนอยู่ตรงหน้าและเสียงเดินทางกลับแนวเดิม · v=340 m/s'},
{id:'b2',title:'ทางโค้งของเสียง',lab:'refraction',brief:'ส่งเสียงจากเขตเย็นไปเขตร้อน สังเกตมุมที่วัดจากเส้นปกติและระยะห่างหน้าคลื่น',target:'ตั้ง T₁=0 °C, T₂=40 °C และมุมตกกระทบ 30°',controls:[range('T1','อุณหภูมิเขต 1',0,40,1,20,'°C'),range('T2','อุณหภูมิเขต 2',0,40,1,20,'°C'),range('angle','มุมตกกระทบจากเส้นปกติ',10,50,1,20,'°')],check:s=>s.T1===0&&s.T2===40&&s.angle===30,q:Q('เมื่อเสียงเข้าสู่เขตร้อนในกรณีนี้ ข้อใดถูกต้อง?',['ความถี่เพิ่มและเบนเข้าหาเส้นปกติ','ความถี่คงเดิม อัตราเร็วเพิ่ม และเบนออกจากเส้นปกติ','อัตราเร็วคงเดิมแต่ความถี่ลด'],1,'sinθ₁/v₁ = sinθ₂/v₂ เมื่อ v₂>v₁ จึงได้ θ₂>θ₁ ความถี่คงเดิมเพราะแหล่งกำเนิดเดิม'),hint:'เปรียบเทียบ v₁ กับ v₂ และมุมที่แสดงข้างเส้นปกติ',note:'จำลองรอยต่ออากาศสองเขตแบบอุดมคติ ไม่รวมลม · ความถี่แหล่งกำเนิดคงเดิม'},
{id:'b3',title:'ประตูแทรกสอด',lab:'interference',brief:'สองแหล่งกำเนิดมีความถี่เท่ากันและเฟสตรงกัน เสียงมี λ=2 m ปรับผลต่างทางเดินเพื่อสร้างจุดหักล้าง',target:'ปรับผลต่างทางเดิน Δr = 1.00 m',controls:[range('dr','ผลต่างทางเดิน Δr',0,4,.05,0,'m')],check:s=>Math.abs(s.dr-1)<.001,q:Q('เหตุใด Δr=1 m จึงให้การหักล้าง เมื่อ λ=2 m?',['คลื่นถึงจุดรับพร้อมกันด้วยเฟสตรงกัน','ผลต่างทางเดินเป็น λ/2 จึงมีเฟสตรงข้าม','คลื่นมีความถี่เปลี่ยนไปคนละค่า'],1,'แหล่งเฟสตรงกันหักล้างเมื่อ Δr=(m+1/2)λ หากแอมพลิจูดที่จุดรับเท่ากันจะหักล้างสมบูรณ์'),hint:'ใช้ Δr=(m+1/2)λ สำหรับแหล่งกำเนิดที่เฟสตรงกัน',note:'แบบจำลองสัญญาณที่จุดรับ: สมมติแอมพลิจูดจากทั้งสองแหล่งเท่ากัน'},
{id:'b4',title:'สัญญาณอ้อมมุม',lab:'diffraction',brief:'มีช่องเปิดกว้าง 1 m เลือกเสียงที่เลี้ยวเบนเด่นเพื่อส่งไปหลังสิ่งกีดขวาง โดย v=340 m/s',target:'ตั้งความถี่ 170 Hz และความกว้างช่อง 1.0 m',controls:[range('f','ความถี่',170,1360,170,1020,'Hz'),range('w','ความกว้างช่อง',.5,3,.5,2,'m')],check:s=>s.f===170&&s.w===1,n:N('เสียง 170 Hz มีความยาวคลื่นเท่าใด?',2,.02,'m','λ=v/f=340/170=2 m จึงมี λ มากกว่าความกว้างช่อง 1 m'),q:Q('เงื่อนไขใดทำให้การเลี้ยวเบนเด่นขึ้น?',['λ มีขนาดใกล้เคียงหรือมากกว่าความกว้างช่อง','λ เล็กกว่าช่องมากเสมอ','ต้องเพิ่มแอมพลิจูดเท่านั้น'],0,'การเลี้ยวเบนเด่นเมื่ออัตราส่วน λ/ช่องเปิดมีค่ามากขึ้น ไม่ได้แปลว่าเสียงความถี่สูงไม่เลี้ยวเบนเลย'),hint:'คำนวณ λ แล้วเปรียบเทียบกับขนาดช่องเปิด',note:'ภาพพัดคลื่นเป็นภาพเชิงคุณภาพของการแผ่ ไม่ใช่แผนที่ความเข้มที่คำนวณจากการเลี้ยวเบนเต็มรูปแบบ'}]},
{title:'เมืองสมดุลเสียง',sub:'ความเข้ม • เดซิเบล • การได้ยิน',icon:'◉',story:'เปิดระบบประกาศให้เมือง แต่รักษาพื้นที่เรียนรู้ให้สงบ วิเคราะห์ระดับเสียงและเลือกวิธีควบคุมเสียงที่เหมาะสม',badge:'นักออกแบบเมืองสมดุล',color:'#ffb36b',quests:[
{id:'c1',title:'วางลำโพงกลางเมือง',lab:'intensity',brief:'แหล่งกำเนิดจุดมีกำลังเสียง 0.001 W แผ่ทุกทิศทาง ทดลองเปรียบเทียบระยะ 2 และ 4 m แล้วบันทึกทั้งสองค่า',target:'ต้องบันทึกที่ระยะ 2 m และ 4 m อย่างน้อยอย่างละ 1 ครั้ง จากนั้นตั้งระยะ 4 m',controls:[range('r','ระยะจากแหล่งกำเนิด',1,10,.5,2,'m')],check:(s,logs)=>s.r===4&&logs.some(l=>l.s.r===2)&&logs.some(l=>l.s.r===4),n:N('เมื่อเพิ่มระยะจาก 2 เป็น 4 m ความเข้มเหลือกี่เท่าของเดิม?',.25,.005,'เท่า','I ∝ 1/r² จึงได้ I₂/I₁=(2/4)²=1/4=0.25'),q:Q('ในแบบจำลองนี้ระดับเสียงลดลงประมาณเท่าใด?',['3 dB','6 dB','12 dB'],1,'Δβ=10 log₁₀(1/4)≈−6.02 dB'),hint:'บันทึกที่ 2 m ก่อน แล้วเปลี่ยนเป็น 4 m และบันทึกอีกครั้ง',note:'แหล่งจุดแผ่ทุกทิศทางในสนามอิสระ ไม่รวมผนัง การดูดกลืน และเสียงพื้นหลัง'},
{id:'c2',title:'ถอดรหัสเดซิเบล',lab:'decibel',brief:'เครื่องวัดส่งข้อมูลเป็นความเข้มเสียง ให้แปลงค่าเป็นระดับเสียงและเปิดสถานีประกาศ',target:'ตั้งเลขชี้กำลังความเข้มเป็น −6 เพื่อให้ I=10⁻⁶ W/m²',controls:[range('exp','เลขชี้กำลังของ I=10ⁿ',-12,-3,1,-9,'')],check:s=>s.exp===-6,n:N('เมื่อ I=10⁻⁶ W/m² ระดับเสียงเท่าใด?',60,.1,'dB','β=10 log₁₀(10⁻⁶/10⁻¹²)=10×6=60 dB'),q:Q('ถ้าความเข้มเพิ่มเป็น 10 เท่า ระดับเสียงเพิ่มเท่าใด?',['10 dB','เพิ่มเป็น 10 เท่าของค่า dB เดิม','1 dB'],0,'ระดับเสียงเป็นมาตราส่วนลอการิทึม เพิ่มความเข้ม 10 เท่า เท่ากับเพิ่มระดับเสียง 10 dB'),hint:'I₀=10⁻¹² W/m² ดังนั้น β=10(n+12)',note:'ค่า dB บนจอเป็นค่าจำลอง ไม่ใช่ระดับเสียงจากลำโพงหรือหูฟังของผู้เล่น'},
{id:'c3',title:'เสียงเดียว หลายสีสัน',lab:'timbre',brief:'เปรียบเทียบเสียงความถี่มูลฐานเดียวกัน ลองเพิ่มฮาร์มอนิกที่ 2 และสังเกตรูปคลื่นกับสเปกตรัม',target:'ตั้ง f₀=440 Hz และสัดส่วนฮาร์มอนิกที่ 2 เท่ากับ 0.60',controls:[range('f','ความถี่มูลฐาน',220,660,20,440,'Hz'),range('h','แอมพลิจูดฮาร์มอนิกที่ 2 เทียบมูลฐาน',0,1,.1,0,'')],check:s=>s.f===440&&Math.abs(s.h-.6)<.001,q:Q('เครื่องดนตรีสองชิ้นเล่นโน้ตเดียวกันแต่ฟังต่างกัน เพราะอะไร?',['ความถี่มูลฐานต้องต่างกันเสมอ','องค์ประกอบฮาร์มอนิกและลักษณะการเปลี่ยนแปลงของเสียงต่างกัน','เสียงหนึ่งไม่ใช่คลื่น'],1,'คุณภาพเสียงสัมพันธ์กับฮาร์มอนิกและรูปแบบการเริ่ม–ดับของเสียง ไม่ใช่เพียงความถี่มูลฐาน'),hint:'ดูแท่งที่ f₀ และ 2f₀ รูปคลื่นเปลี่ยนแม้ f₀ เท่าเดิม',note:'จำลองเฉพาะผลของฮาร์มอนิกที่ 2 โดยปรับสเกลภาพ ไม่จำลองช่วงเริ่ม–ดับเสียงเครื่องดนตรีทั้งหมด'},
{id:'c4',title:'ปกป้องพื้นที่เรียนรู้',lab:'hearing',brief:'สำรวจเส้นทางการได้ยิน แล้วเลือกวิธีลดเสียงจากเครื่องจักรใกล้ห้องเรียน',target:'เลือกมาตรการ “ลดเสียงที่ต้นกำเนิด” และกดบันทึก',controls:[select('part','สำรวจส่วนของการได้ยิน',['ใบหูและช่องหู','แก้วหูและกระดูกหู','คอเคลียและเซลล์ขน','เส้นประสาทหูและสมอง']),select('measure','มาตรการลดเสียง',['เปิดเสียงประกาศแข่งกับเครื่องจักร','ลดเสียงที่ต้นกำเนิด','เพิ่มเครื่องจักรใกล้ห้องเรียน'],0)],check:s=>s.measure===1,q:Q('ลำดับการส่งต่อสัญญาณใดถูกต้อง?',['คอเคลีย → ใบหู → สมอง → แก้วหู','ใบหู/ช่องหู → แก้วหู/กระดูกหู → คอเคลีย → เส้นประสาทหู/สมอง','สมอง → กระดูกหู → ใบหู'],1,'หูชั้นนอกนำเสียง หูชั้นกลางส่งการสั่น หูชั้นในเปลี่ยนเป็นสัญญาณประสาท แล้วส่งไปแปลผลที่สมอง'),hint:'เริ่มจากเสียงเข้าสู่หู และแยกการควบคุมเสียงที่แหล่งกำเนิด ทางผ่าน และผู้รับ',note:'การควบคุมเสียงอาจทำที่แหล่งกำเนิด ทางผ่าน และผู้รับ โดยพิจารณาบริบทและระยะเวลารับเสียง'}]},
{title:'หอคอยสั่นพ้อง',sub:'ท่ออากาศ • คลื่นนิ่ง • ห้องทดลอง',icon:'⋮',story:'ประตูหอคอยเปิดด้วยการสั่นพ้องของคอลัมน์อากาศ เลื่อนลูกสูบ เก็บข้อมูล และค้นหารหัสความยาว',badge:'ผู้เชี่ยวชาญการสั่นพ้อง',color:'#66e4dc',quests:[
{id:'d1',title:'ค้นหาสั่นพ้องครั้งแรก',lab:'resonance',brief:'ใช้เสียง 500 Hz และ v=340 m/s เลื่อนลูกสูบให้ได้แอมพลิจูดตอบสนองสูงสุดครั้งแรก',target:'ตั้งความยาวท่อ 0.17 m และความถี่ 500 Hz',controls:[range('L','ความยาวคอลัมน์อากาศ',.05,.9,.01,.1,'m'),range('f','ความถี่',200,800,10,500,'Hz')],check:s=>Math.abs(s.L-.17)<.004&&s.f===500,n:N('ความยาวคลื่นของเสียง 500 Hz เท่าใด?',.68,.005,'m','λ=v/f=340/500=0.68 m และ L₁=λ/4=0.17 m'),q:Q('ปลายปิดของท่อเป็นตำแหน่งใด?',['ปฏิบัพการกระจัดและบัพความดัน','บัพทั้งการกระจัดและความดัน','บัพการกระจัดและปฏิบัพความดัน'],2,'อากาศที่ปลายปิดเคลื่อนที่ตามแนวท่อไม่ได้ จึงเป็นบัพการกระจัด แต่ความดันแปรผันได้มาก'),hint:'สำหรับท่อเปิดหนึ่งด้าน L₁=λ/4=v/(4f)',note:'ท่ออุดมคติ ไม่รวมการแก้ปลายท่อ · กราฟโหมดแสดงรูปร่างที่ความยาวสั่นพ้องใกล้ที่สุด'},
{id:'d2',title:'เก็บหลักฐานสองตำแหน่ง',lab:'resonance',brief:'เก็บข้อมูลสั่นพ้องครั้งแรกและครั้งถัดไปที่ 500 Hz ใช้ผลต่างความยาวคำนวณอัตราเร็วเสียง',target:'บันทึกที่ L=0.17 และ 0.51 m โดย f=500 Hz แล้วจบที่ 0.51 m',controls:[range('L','ความยาวคอลัมน์อากาศ',.05,.9,.01,.17,'m'),range('f','ความถี่',200,800,10,500,'Hz')],check:(s,logs)=>Math.abs(s.L-.51)<.004&&s.f===500&&[.17,.51].every(v=>logs.some(l=>Math.abs(l.s.L-v)<.004&&l.s.f===500)),n:N('จาก L₂−L₁=0.34 m และ f=500 Hz อัตราเร็วเสียงเท่าใด?',340,1,'m/s','λ=2(L₂−L₁)=0.68 m ดังนั้น v=fλ=340 m/s'),q:Q('ความยาวสั่นพ้องที่ติดกันต่างกันเท่าใด?',['λ/4','λ/2','λ'],1,'ท่อเปิดหนึ่งด้านสั่นพ้องที่ λ/4, 3λ/4, 5λ/4,… จึงต่างกัน λ/2'),hint:'ต้องกดบันทึกสองครั้งที่ความยาวต่างกัน ก่อนส่งภารกิจ',note:'ต่อยอดการทดลองจริงได้โดยวัด L₁,L₂ ด้วยท่อและระดับน้ำ แล้วอภิปรายความคลาดเคลื่อน'},
{id:'d3',title:'อ่านแผนที่คลื่นนิ่ง',lab:'standing',brief:'สำรวจโหมดที่ 1, 2 และ 3 ของท่อเปิดหนึ่งด้าน สลับดูการกระจัดและความดัน',target:'ตั้งโหมดที่ 2 (ฮาร์มอนิกที่ 3) และเลือกดูความดัน',controls:[range('mode','ลำดับโหมด',1,3,1,1,''),select('view','กราฟที่แสดง',['การกระจัด','ความดันส่วนเกิน'])],check:s=>s.mode===2&&s.view===1,q:Q('โหมดที่ 2 ของท่อเปิดหนึ่งด้านมีความถี่เป็นกี่เท่าของมูลฐาน?',['2 เท่า','3 เท่า','4 เท่า'],1,'ท่ออุดมคติเปิดหนึ่งด้านมีฮาร์มอนิกคี่ f₁,3f₁,5f₁,… ส่วนบัพ–ปฏิบัพของความดันสลับกับการกระจัด'),hint:'ใช้ fₙ=(2n−1)v/(4L) โดย n คือ “ลำดับโหมด”',note:'เส้นประคือซองแอมพลิจูดของคลื่นนิ่ง เส้นสีคือค่าขณะหนึ่ง · ปลายซ้ายปิด ปลายขวาเปิด'}]},

const quests=stages.flatMap(s=>s.quests), KEY='sonicQuest_v1_full', fresh=()=>({version:1,name:'',done:{},logs:{},notes:{},tries:{},settings:{},answers:{},last:null,created:new Date().toISOString()});
let data=fresh(),storageOK=true;try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p.version===1)data=Object.assign(fresh(),p);}}catch(e){storageOK=false}
let current=null,sim={},time=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,slow=false,lastFrame=0,sound=false,ac=null,voices=[],master=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$('saveState').textContent='✓ บันทึกในเครื่องแล้ว';}catch(e){storageOK=false;$('saveState').textContent='ใช้ส่งออกเพื่อบันทึก';}}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hide');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hide'),3500)}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;if(!$('modal').open)$('modal').showModal();}
function finished(i){return stages[i].quests.every(q=>data.done[q.id])}function unlocked(i){return i===0||finished(i-1)}function countDone(){return quests.filter(q=>data.done[q.id]).length}function score(){return quests.reduce((n,q)=>n+(data.done[q.id]?.score||0),0)}
function citySVG(){return `<svg class="city" viewBox="0 0 520 250" role="img" aria-label="เมืองโซโนวาและเครือข่ายคลื่นเสียง"><defs><linearGradient id="build" x2="0" y2="1"><stop stop-color="#25545c"/><stop offset="1" stop-color="#132d3c"/></linearGradient></defs><g fill="none" stroke="#416770" opacity=".45"><ellipse cx="275" cy="207" rx="210" ry="33"/><ellipse cx="275" cy="207" rx="150" ry="23"/><path d="M40 207H500M275 15V240M85 90L450 235M455 70L90 235"/></g><g fill="url(#build)" stroke="#5c9b9b">${[[85,126,48,80],[156,85,50,122],[228,33,67,174],[320,108,43,98],[396,70,49,136]].map(([x,y,w,h],i)=>`<path d="M${x} ${y}l${w/2} -12 ${w/2} 12v${h}h-${w}z"/><path d="M${x+w/2} ${y-12}v${h+12}" opacity=".4"/>${[0,1,2].map(k=>`<path d="M${x+8} ${y+24+k*18}h${w-16}" stroke="${finished(Math.min(i,5))?'#ffc17b':'#66e4dc'}"/>`).join('')}`).join('')}</g><g fill="none" stroke="#66e4dc" opacity=".65"><circle cx="262" cy="44" r="23"/><circle cx="262" cy="44" r="38" stroke-dasharray="4 8"/><path d="M65 190Q130 55 210 126T460 145" stroke-dasharray="5 6"/></g><circle cx="262" cy="44" r="5" fill="#ffb36b"/><text x="333" y="32" fill="#a4cdc9" font-size="10" font-family="monospace">SONOVA / ONLINE ${stages.slice(0,6).filter((s,i)=>finished(i)).length}/6</text></svg>`}
function goHome(){stash();current=null;updateAudio();const n=countDone(),max=quests.length;let next=stages.findIndex((s,i)=>unlocked(i)&&!finished(i));if(next<0)next=6;
$('app').innerHTML=`<section class="hero"><div><span class="eyebrow">MISSION CONTROL / SOUND PHYSICS · M.5</span><h1>เมืองนี้…<br>รอคลื่นเสียงของคุณ</h1><p class="muted">รับบทวิศวกรเสียง กู้คืนเมืองโซโนวาผ่านการทดลอง แก้ปริศนา และค้นพบฟิสิกส์ที่ซ่อนอยู่ในทุกเสียง</p><div class="row"><button class="primary" onclick="startGame(${next})">${n?'เล่นต่อจากภารกิจล่าสุด':'เริ่มภารกิจกู้เมือง'} ↗</button><button class="quiet" onclick="showIntro()">วิธีเล่น</button></div><p class="note" style="margin-top:15px">${data.name?'วิศวกร: '+esc(data.name)+' · ':''}เล่นคนเดียวหรือกลุ่ม 3–4 คน · ไม่มีการจับเวลาแข่งขัน</p></div>${citySVG()}</section><div class="stats"><div class="stat"><b>${stages.slice(0,6).filter((s,i)=>finished(i)).length} / 6</b><span>สถานีที่กู้คืนแล้ว</span></div><div class="stat"><b>${n} / ${max}</b><span>ภารกิจที่สำเร็จ</span></div><div class="stat"><b>${score()} XP</b><span>คะแนนความพยายามและความเข้าใจ</span></div></div><div class="sectionhead"><h2>เลือกสถานีสำรวจ</h2><span class="muted">ทดลอง → บันทึก → อธิบาย → ปลดล็อก</span></div><div class="cards">${stages.map((s,i)=>{const done=s.quests.filter(q=>data.done[q.id]).length,open=unlocked(i);return `<article class="card station ${finished(i)?'done':''}"><span class="num">${i===6?'✦':String(i+1).padStart(2,'0')} <span style="color:${s.color};font-weight:400">${s.icon}</span></span><span class="status">${finished(i)?'✓ ฟื้นฟูสำเร็จ':open?'พร้อมสำรวจ':'▣ รอปลดล็อก'}</span><h3>${s.title}</h3><p>${s.sub}</p><div class="stationline"><i style="width:${done/s.quests.length*100}%"></i></div><div class="row" style="width:100%;justify-content:space-between"><span class="note">${done}/${s.quests.length} ภารกิจ</span><button class="small ${open?'primary':''}" ${open?'':'disabled'} onclick="openStage(${i})">${finished(i)?'ทบทวน':open?'เข้าสถานี →':'ผ่านสถานีก่อนหน้า'}</button></div></article>`}).join('')}</div><section class="card" style="margin-top:20px"><div class="row" style="justify-content:space-between"><div><h3>สมุดบันทึกของวิศวกร</h3><span class="muted mini">เก็บคำอธิบายและข้อมูลทดลองไว้ส่งครู หรือย้ายไปเล่นอีกเครื่อง</span></div><div class="row"><button onclick="showResults()">เปิดรายงาน</button><button onclick="exportSave()">สำรองความก้าวหน้า</button><button onclick="$('importFile').click()">นำเข้าข้อมูล</button></div></div></section>`;window.scrollTo(0,0)}
function showIntro(){modal('ยินดีต้อนรับ วิศวกรเสียง',`<div class="helptext"><p>เมืองโซโนวาขาดระบบสื่อสาร คุณกับผู้ช่วย <b>เรโซ</b> ต้องฟื้นฟู 6 สถานี แล้วเปิดเทศกาลวิทยาศาสตร์ให้สำเร็จ</p><ol><li>อ่านสถานการณ์และเงื่อนไขภารกิจ</li><li>ปรับตัวแปรในห้องทดลอง สังเกตภาพและค่าที่วัดได้</li><li>กด <b>บันทึกหลักฐาน</b> บางภารกิจต้องบันทึกสองค่าที่ต่างกัน</li><li>ตอบโจทย์และเขียนสิ่งที่ค้นพบอย่างน้อย 15 ตัวอักษร</li><li>ส่งภารกิจ รับคำอธิบาย และปลดล็อกภารกิจถัดไป</li></ol><p>แต่ละภารกิจมี 100 XP หากต้องแก้ไขจะลดครั้งละ 10 XP แต่ไม่ต่ำกว่า 60 XP คำใบ้ไม่หักคะแนน คะแนนเกมไม่ใช่ผลสอบรายบุคคล</p><p>ทุกด่านเล่นแบบปิดเสียงได้ ภาพเคลื่อนไหวใช้หยุดภาพหรือโหมดช้าได้ ไม่ต้องแข่งกับเวลา</p><p>ชื่อและผลเล่นเก็บเฉพาะเบราว์เซอร์นี้ ควรส่งออกข้อมูลก่อนย้ายเครื่องหรือปิดโหมดส่วนตัว</p><label for="playerName">ชื่อผู้เล่น / ชื่อกลุ่ม (ไม่จำเป็น)</label><input id="playerName" type="text" maxlength="80" value="${esc(data.name)}" placeholder="เช่น ทีมคลื่นพลังงาน"><button class="primary wide" onclick="data.name=$('playerName').value.trim();save();$('modal').close();openStage(0)">พร้อมเริ่มด่านที่ 1 →</button></div>`)}
function startGame(i){if(!data.name&&countDone()===0)showIntro();else openStage(i)}
function openStage(i){if(!unlocked(i)){toast('ผ่านสถานีก่อนหน้าเพื่อปลดล็อก');return}let j=stages[i].quests.findIndex(q=>!data.done[q.id]);openQuest(i,j<0?0:j)}
function stash(){if(!current)return;const q=stages[current.i].quests[current.j];if($('reflection'))data.notes[q.id]=$('reflection').value;if($('numeric'))data.answers[q.id]={...(data.answers[q.id]||{}),n:$('numeric').value};const checked=document.querySelector('input[name="choice"]:checked');if(checked)data.answers[q.id]={...(data.answers[q.id]||{}),q:Number(checked.value)};data.settings[q.id]={...sim};save()}
function openQuest(i,j){if(!unlocked(i)||j<0||j>=stages[i].quests.length)return;if(j>0&&!data.done[stages[i].quests[j-1].id]){toast('ทำภารกิจก่อนหน้าให้สำเร็จก่อน');return}stash();current={i,j};const st=stages[i],q=st.quests[j];sim=Object.fromEntries(q.controls.map(c=>[c.key,c.value]));if(data.settings[q.id])for(const c of q.controls){const x=Number(data.settings[q.id][c.key]);if(Number.isFinite(x)&& (c.options?x>=0&&x<c.options.length&&Number.isInteger(x):x>=c.min&&x<=c.max))sim[c.key]=x}data.last={i,j};save();time=0;const a=data.answers[q.id]||{};
$('app').innerHTML=`<div class="gamehead"><div><div class="breadcrumbs">SONOVA / ${i===6?'FINAL MISSION':'STATION '+String(i+1).padStart(2,'0')}</div><h2>${st.title}</h2><span class="muted mini">${st.story}</span></div><button class="small" onclick="goHome()">← แผนที่</button></div><div class="layout"><nav class="rail" aria-label="ภารกิจในสถานี"><p class="eyebrow">MISSION LOG</p>${st.quests.map((z,k)=>`<button class="${k===j?'active':''}" ${k>0&&!data.done[st.quests[k-1].id]?'disabled':''} onclick="openQuest(${i},${k})"><span>${data.done[z.id]?'✓':String(k+1).padStart(2,'0')} ${z.title}</span><div class="caption">${data.done[z.id]?'สำเร็จ · '+data.done[z.id].score+' XP':k===j?'กำลังสำรวจ':'ภารกิจถัดไป'}</div></button>`).join('')}<p class="caption">ทุกครั้งที่ทดลอง คือหลักฐานใหม่<br>คำใบ้ไม่หักคะแนน</p></nav><section class="mainlab"><div class="stage"><div class="stagebar"><span><i class="live"></i>LIVE LAB / ห้องทดลองคลื่นเสียง</span><div class="row"><button class="small quiet" id="pauseBtn" onclick="paused=!paused;this.textContent=paused?'▶ เล่นภาพ':'Ⅱ หยุดภาพ'">${paused?'▶ เล่นภาพ':'Ⅱ หยุดภาพ'}</button><button class="small quiet" id="slowBtn" onclick="slow=!slow;this.textContent=slow?'0.3× ช้า':'1× ปกติ'">${slow?'0.3× ช้า':'1× ปกติ'}</button></div></div><div class="canvaswrap"><canvas id="lab" width="760" height="380" role="img" aria-label="ภาพจำลอง ${esc(q.title)} ค่าที่อ่านได้อยู่ใต้ภาพ"></canvas></div><div class="readings" id="readings" aria-live="off"></div><div class="simnote">${q.note}</div><div class="controlpanel"><div class="controls">${q.controls.map(c=>`<div class="control"><label for="ctrl_${c.key}">${c.label}<output id="out_${c.key}">${c.options?'':sim[c.key]+' '+c.unit}</output></label>${c.options?`<select id="ctrl_${c.key}" onchange="changeControl('${c.key}',this.value)">${c.options.map((s,n)=>`<option value="${n}" ${sim[c.key]===n?'selected':''}>${s}</option>`).join('')}</select>`:`<input type="range" id="ctrl_${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${sim[c.key]}" oninput="changeControl('${c.key}',this.value)">`}</div>`).join('')}</div><div class="row" style="margin-top:17px"><button class="primary" onclick="record()">＋ บันทึกหลักฐาน</button><button class="small quiet" onclick="resetSim()">คืนค่าทดลอง</button></div></div></div><div class="card log"><div class="row" style="justify-content:space-between"><h3>สมุดข้อมูลทดลอง</h3><span id="logCount" class="pill"></span></div><div id="logs"></div></div></section><aside class="mission"><span class="eyebrow">${i===6?'FINAL CHALLENGE':'CHALLENGE'} ${j+1} / ${st.quests.length}</span><h3>${q.title}</h3><p class="muted" style="font-size:14px">${q.brief}</p><div class="target"><b>เป้าหมายการทดลอง</b><br>${q.target}</div>${q.n?`<div class="question"><label for="numeric">${q.n.title} <span class="muted">(${q.n.unit})</span></label><input type="number" inputmode="decimal" id="numeric" step="any" value="${esc(a.n??'')}" placeholder="ใส่เฉพาะตัวเลข"></div>`:''}<div class="question"><label>${q.q.title}</label><div class="choices">${q.q.opts.map((o,k)=>`<label class="choice"><input type="radio" name="choice" value="${k}" ${a.q===k?'checked':''}><span>${o}</span></label>`).join('')}</div></div><label for="reflection" class="mini">บันทึกสิ่งที่ค้นพบ <span class="muted">(อย่างน้อย 15 ตัวอักษร)</span></label><textarea id="reflection" maxlength="2000" placeholder="ฉันเปลี่ยน… พบว่า… เพราะ…" onchange="stash()">${esc(data.notes[q.id]||'')}</textarea><p class="note">คำอธิบายนี้เก็บให้ครูประเมิน ระบบตรวจเพียงว่ากรอกครบ</p><button class="primary wide" onclick="submitQuest()">ตรวจและส่งภารกิจ →</button><button class="quiet small wide" onclick="$('hint').classList.toggle('hide')">ขอคำใบ้จากเรโซ</button><div id="hint" class="hint hide">◈ เรโซ: ${q.hint}</div><div id="feedback" role="status">${data.done[q.id]?`<div class="feedback ok">✓ สำเร็จแล้ว · ${data.done[q.id].score} XP<br>${q.q.why}${q.n?'<br>'+q.n.why:''}</div><button class="orange wide" onclick="nextQuest()">${j===st.quests.length-1?'สรุปสถานี →':'ภารกิจถัดไป →'}</button>`:''}</div></aside></div>`;refreshReadings();renderLogs();updateAudio();window.scrollTo(0,0)}
function changeControl(k,v){sim[k]=Number(v);const q=getQ(),c=q.controls.find(c=>c.key===k);if(!c.options)$('out_'+k).textContent=sim[k]+' '+c.unit;data.settings[q.id]={...sim};save();refreshReadings();updateAudio()}
function resetSim(){const q=getQ();q.controls.forEach(c=>{sim[c.key]=c.value;$('ctrl_'+c.key).value=c.value;if(!c.options)$('out_'+c.key).textContent=c.value+' '+c.unit});data.settings[q.id]={...sim};refreshReadings();updateAudio();save()}
function getQ(){return current?stages[current.i].quests[current.j]:null}
function readings(q,s){switch(q.lab){case'particle':return[['ความถี่ภาพ',s.f+' Hz'],['แอมพลิจูด',s.a+' หน่วย'],['ชนิดคลื่น','ตามยาว']];case'phase':return[['ตำแหน่ง',s.x.toFixed(2)+' λ'],['การกระจัด ξ/A',Math.sin(2*Math.PI*s.x).toFixed(2)],['ความดัน Δp/B',(-Math.cos(2*Math.PI*s.x)).toFixed(2)]];case'travel':return[['อัตราเร็ว',(331+.6*s.T).toFixed(1)+' m/s'],['ความถี่',s.f+' Hz'],['ความยาวคลื่น',((331+.6*s.T)/s.f).toFixed(3)+' m']];case'echo':return[['ระยะกำแพง',s.d+' m'],['เวลาไป–กลับ',(2*s.d/340).toFixed(3)+' s'],['ระยะทางรวม',2*s.d+' m']];case'refraction':return[['อัตราเร็วเขต 1',(331+.6*s.T1).toFixed(1)+' m/s'],['อัตราเร็วเขต 2',(331+.6*s.T2).toFixed(1)+' m/s'],['มุมหักเห',(Math.asin((331+.6*s.T2)/(331+.6*s.T1)*Math.sin(s.angle*Math.PI/180))*180/Math.PI).toFixed(1)+'°']];case'interference':return[['ความยาวคลื่น','2.00 m'],['ผลต่างทางเดิน',s.dr.toFixed(2)+' m'],['แอมพลิจูดรวม / A',(2*Math.abs(Math.cos(Math.PI*s.dr/2))).toFixed(2)]];case'diffraction':return[['ความยาวคลื่น',(340/s.f).toFixed(2)+' m'],['ความกว้างช่อง',s.w.toFixed(1)+' m'],['อัตราส่วน λ/a',(340/s.f/s.w).toFixed(2)]];case'intensity':{const I=.001/(4*Math.PI*s.r*s.r);return[['ความเข้ม',I.toExponential(2)+' W/m²'],['ระดับเสียง',(10*Math.log10(I/1e-12)).toFixed(2)+' dB'],['ระยะ',s.r+' m']]};case'decibel':return[['ความเข้ม','10^'+s.exp+' W/m²'],['ระดับเสียง',(10*(s.exp+12))+' dB'],['ค่าอ้างอิง','10⁻¹² W/m²']];case'timbre':return[['มูลฐาน',s.f+' Hz'],['ฮาร์มอนิกที่ 2',2*s.f+' Hz'],['สัดส่วน A₂/A₁',s.h.toFixed(2)]];case'hearing':return[['ส่วนที่สำรวจ',['หูชั้นนอก','หูชั้นกลาง','หูชั้นใน','ประสาท/สมอง'][s.part]],['หน้าที่',['นำเสียง','ส่งการสั่น','สร้างสัญญาณประสาท','ส่ง/แปลผล'][s.part]],['มาตรการ',s.measure===1?'ลดที่ต้นกำเนิด':'ยังไม่เหมาะสม']];case'resonance':{const n=Math.max(1,Math.round((4*s.L*s.f/340+1)/2)),target=(2*n-1)*340/(4*s.f),response=1/(1+Math.pow((s.L-target)/.014,2));return[['ความยาวคลื่น',(340/s.f).toFixed(3)+' m'],['ตอบสนองสัมพัทธ์',(response*100).toFixed(0)+'%'],['โหมดใกล้ที่สุด',String(n)]]};case'standing':return[['ลำดับโหมด',String(s.mode)],['ฮาร์มอนิก',String(2*s.mode-1)],['ความถี่',(2*s.mode-1)+' × f₁']];case'beats':return[['f₁',s.f1+' Hz'],['f₂',s.f2+' Hz'],['บีต',Math.abs(s.f2-s.f1)+' Hz']];case'doppler':return[['เสียงต้นทาง','600 Hz'],['เสียงที่ได้รับ',(600*340/(340+(s.dir===0?-s.vs:s.vs))).toFixed(2)+' Hz'],['เลขมัค',(s.vs/340).toFixed(2)]];case'observer':return[['เสียงต้นทาง','600 Hz'],['เสียงที่ได้รับ',(600*(340+(s.dir===0?s.vo:-s.vo))/340).toFixed(2)+' Hz'],['ผู้สังเกต',s.vo+' m/s']];case'mach':return[['เลขมัค',s.M.toFixed(1)],['ความเร็วยาน',(s.M*340).toFixed(0)+' m/s'],['มุมครึ่งกรวย',s.M>1?(Math.asin(1/s.M)*180/Math.PI).toFixed(1)+'°':'ยังไม่มีกรวยมัค']];default:return[]}}
function refreshReadings(){if(!current)return;$('readings').innerHTML=readings(getQ(),sim).map(([k,v])=>`<div class="reading"><small>${k}</small><b>${v}</b></div>`).join('')}
function record(){const q=getQ(),logs=data.logs[q.id]||(data.logs[q.id]=[]);if(logs.length>=60){toast('บันทึกได้สูงสุด 60 แถวต่อภารกิจ ลบแถวที่ไม่ใช้ก่อน');return}logs.push({s:{...sim},at:new Date().toISOString(),values:readings(q,sim)});save();renderLogs();toast('บันทึกหลักฐานแล้ว ✓')}
function deleteLog(n){data.logs[getQ().id].splice(n,1);save();renderLogs()}
function renderLogs(){const logs=data.logs[getQ().id]||[];$('logCount').textContent=logs.length+' ชุดข้อมูล';$('logs').innerHTML=logs.length?`<div class="tablewrap"><table><thead><tr><th>ครั้ง</th><th>ค่าที่ตั้ง</th><th>ค่าที่อ่านได้</th><th></th></tr></thead><tbody>${logs.map((l,i)=>`<tr><td>${i+1}</td><td>${getQ().controls.map(c=>esc(c.label)+': '+esc(c.options?c.options[l.s[c.key]]:l.s[c.key]+' '+c.unit)).join('<br>')}</td><td>${l.values.map(([k,v])=>esc(k)+': '+esc(v)).join('<br>')}</td><td><button class="small quiet" onclick="deleteLog(${i})" aria-label="ลบข้อมูลครั้งที่ ${i+1}">×</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="note">ยังไม่มีข้อมูล ลองปรับตัวแปร แล้วกด “บันทึกหลักฐาน” เพื่อเก็บผลทดลอง</p>'}

function animate(ts){const dt=Math.min(.05,(ts-lastFrame)/1000||0);lastFrame=ts;if(!paused)time+=dt*(slow?.3:1);if(current)draw();requestAnimationFrame(animate)}
function stopAudio(){voices.forEach(o=>{try{o.stop();o.disconnect()}catch(e){}});voices=[];if(master){try{master.disconnect()}catch(e){}}master=null}
function updateAudio(){stopAudio();if(!sound||!current||!ac)return;const q=getQ(),s=sim;let fs=[];switch(q.lab){case'beats':fs=[s.f1,s.f2];break;case'timbre':fs=[s.f,2*s.f];break;case'travel':case'diffraction':case'resonance':fs=[s.f];break;case'doppler':fs=[600*340/(340+(s.dir===0?-s.vs:s.vs))];break;case'observer':fs=[600*(340+(s.dir===0?s.vo:-s.vo))/340];break;default:return}master=ac.createGain();master.gain.value=.035;master.connect(ac.destination);fs.forEach((f,i)=>{const o=ac.createOscillator(),gain=ac.createGain();o.frequency.value=f;o.type='sine';gain.gain.value=q.lab==='timbre'?(i===0?1/(1+s.h):s.h/(1+s.h)):1/fs.length;o.connect(gain);gain.connect(master);o.start();voices.push(o)});}
async function toggleSound(){if(sound){sound=false;stopAudio()}else{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume();sound=true;updateAudio();toast('เปิดเสียงตัวอย่างแล้ว ปรับระดับเสียงอุปกรณ์ให้ฟังสบาย');}catch(e){toast('อุปกรณ์นี้ไม่รองรับเสียงตัวอย่าง เล่นผ่านภาพได้ทุกด่าน');sound=false}}$('soundBtn').textContent=sound?'♪ เสียง: เปิด':'♪ เสียง: ปิด';$('soundBtn').setAttribute('aria-pressed',String(sound))}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio();else updateAudio()});
const knowledge=[
['01 · กำเนิดและการเคลื่อนที่','เสียงในอากาศเกิดจากการสั่นของแหล่งกำเนิด เป็นคลื่นกลตามยาว ต้องอาศัยตัวกลาง อนุภาคสั่นขนานทิศการเคลื่อนที่ของคลื่น ไม่เดินทางตามคลื่นจากต้นทางถึงปลายทาง','v = fλ   |   v ≈ 331 + 0.6T (m/s)','T เป็น °C สูตรอัตราเร็วเป็นค่าประมาณ สำหรับคลื่นเดินทางแบบไซน์ ความดันส่วนเกินกับการกระจัดต่างเฟส π/2'],
['02 · สมบัติคลื่น','การสะท้อน: มุมตกกระทบเท่ามุมสะท้อน วัดจากเส้นปกติ การหักเห: ความถี่คงเดิมเมื่อผ่านตัวกลาง ส่วน v และ λ เปลี่ยน การแทรกสอดเกิดจากการซ้อนทับ การเลี้ยวเบนเด่นเมื่อ λ ใกล้เคียงหรือมากกว่าช่องเปิด','เสียงสะท้อน d=vt/2 · sinθ₁/v₁ = sinθ₂/v₂','แหล่งเฟสตรงกัน: เสริม Δr=mλ, หักล้าง Δr=(m+½)λ โดย m=0,1,2,… หักล้างสมบูรณ์เมื่อแอมพลิจูดที่จุดรับเท่ากัน'],
['03 · ความเข้มและระดับเสียง','ความเข้มคือกำลังเสียงต่อพื้นที่ หน่วย W/m² ระดับเสียง β หน่วย dB เป็นมาตราส่วนลอการิทึม ไม่บวกค่า dB โดยตรงเมื่อต้องรวมแหล่งเสียง','I=P/(4πr²) · β=10 log₁₀(I/I₀) · I₀=10⁻¹² W/m²','สูตร I ตามระยะใช้กับแหล่งจุดแผ่ทุกทิศทางในสนามอิสระ ความเข้มเพิ่ม 10 เท่า ระดับเสียงเพิ่ม 10 dB ระยะเพิ่ม 2 เท่า ระดับเสียงลดประมาณ 6.02 dB'],
['04 · การได้ยินและคุณภาพเสียง','ใบหู/ช่องหูนำเสียง → แก้วหู/กระดูกหูส่งการสั่น → คอเคลียและเซลล์ขนเปลี่ยนเป็นสัญญาณประสาท → เส้นประสาทหูและสมองส่งต่อ/แปลผล','ความถี่สัมพันธ์กับระดับสูง–ต่ำ · ฮาร์มอนิกและช่วงเริ่ม–ดับสัมพันธ์กับคุณภาพเสียง','ความดังที่รับรู้ไม่ใช่ค่าเดียวกับความเข้มเชิงฟิสิกส์ การลดมลพิษทางเสียงพิจารณาต้นกำเนิด ทางผ่าน และผู้รับ รวมทั้งเวลาที่รับเสียง'],
['05 · ท่อเปิดหนึ่งด้านและคลื่นนิ่ง','การสั่นพ้องทำให้แอมพลิจูดตอบสนองสูงเมื่อความถี่กระตุ้นตรงกับความถี่ธรรมชาติ คลื่นนิ่งเกิดจากคลื่นที่เดินทางสวนกันซ้อนทับ มีบัพและปฏิบัพประจำตำแหน่ง','Lₙ=(2n−1)λ/4 · fₙ=(2n−1)v/(4L) · ΔL=λ/2','n=1,2,3,… คือลำดับโหมด ปลายปิด: บัพการกระจัด/ปฏิบัพความดัน ปลายเปิด: ปฏิบัพการกระจัด/บัพความดัน โดยประมาณ ท่อจริงมีการแก้ปลายท่อ'],

function showTeacher(){modal('คู่มือครูและการประเมิน',`<div class="helptext"><p><b>เวลาแนะนำ:</b> 6–7 คาบ คาบละประมาณ 50 นาที กลุ่มละ 3–4 คน สลับผู้ควบคุม ผู้คำนวณ ผู้สังเกต และผู้อธิบาย</p><p><b>ในแต่ละคาบ:</b> เปิดสถานการณ์ 5 นาที เล่น/ทดลอง 20 นาที อธิบายหลักฐาน 10 นาที อภิปรายหลักการ 10 นาที ตรวจรายบุคคล 5 นาที</p><table><tr><th>ผลการเรียนรู้</th><th>ด่าน/หลักฐาน</th></tr><tr><td>1. กำเนิดเสียง กราฟ อุณหภูมิ สมบัติคลื่น</td><td>สถานี 1–2 และคำอธิบายในสมุดข้อมูล</td></tr><tr><td>2. ความเข้ม ระดับเสียง การได้ยิน คุณภาพเสียง มลพิษ</td><td>สถานี 3 และภารกิจสุดท้ายข้อ 1</td></tr><tr><td>3. ทดลองท่อ บีต คลื่นนิ่ง ดอปเพลอร์ คลื่นกระแทก</td><td>สถานี 4–6 และภารกิจสุดท้ายข้อ 2–3</td></tr></table><p><b>เกณฑ์ประเมินครู:</b> การทดลอง 30% การอธิบาย 30% การคำนวณ 25% การประยุกต์ 15% คะแนน XP เป็นคะแนนเกมแยกจากเกณฑ์นี้</p><p><b>ท่อจริง:</b> ใช้ท่อเปิดหนึ่งด้านกับส้อมเสียงหรือแหล่งกำเนิดความถี่ทราบค่า วัดความยาวสั่นพ้องติดกัน L₁,L₂ แล้วคำนวณ v=2f(L₂−L₁) เปรียบเทียบผลกับแบบจำลองและอภิปรายการแก้ปลายท่อ ความละเอียดการวัด และอุณหภูมิ</p><p><b>ข้อจำกัด:</b> ระบบตรวจคำตอบปรนัย ตัวเลข และเงื่อนไขทดลอง ส่วนคำอธิบายอิสระตรวจเฉพาะความยาว ครูต้องอ่านประเมินความหมายเอง เกมไม่ใช่ระบบสอบที่ป้องกันการดูเฉลยในโค้ด</p><p><b>การบันทึก:</b> เก็บข้อมูลบนเครื่องเดียว ไม่มีบัญชีหรือระบบรวมคะแนนชั้นเรียน นักเรียนดาวน์โหลดรายงาน HTML ส่งครู และสำรอง JSON เพื่อย้ายเครื่อง</p><p><b>เสียงตัวอย่าง:</b> ค่า dB จำลองไม่ใช่ค่าจากลำโพงจริง ทุกภารกิจเล่นได้โดยปิดเสียง และปรับหยุดภาพสำหรับผู้ที่ไม่สะดวกดูการเคลื่อนไหว</p></div>`)}
function download(name,body,type){const blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function reportHTML(){let h=`<h1>SONIC QUEST — รายงานการเรียนรู้เรื่องเสียง ม.5</h1><p>ผู้เล่น/กลุ่ม: ${esc(data.name||'ไม่ได้ระบุ')} · วันที่รายงาน: ${new Date().toLocaleString('th-TH')}</p><p>ภารกิจสำเร็จ ${countDone()}/${quests.length} · ${score()} XP · สถานะ ${countDone()===quests.length?'กู้เมืองสำเร็จ':'อยู่ระหว่างเรียนรู้'}</p><p>คะแนน XP เป็นคะแนนเกม คำอธิบายต้องได้รับการประเมินโดยครู</p>`;for(const st of stages){h+=`<h2>${st.title}</h2>`;for(const q of st.quests){const a=data.answers[q.id]||{},logs=data.logs[q.id]||[];h+=`<section><h3>${q.title} — ${data.done[q.id]?'ผ่าน '+data.done[q.id].score+' XP':'ยังไม่ผ่าน'}</h3><p>${q.brief}</p><p>คำตอบคำนวณ: ${q.n?esc(a.n??'ยังไม่ตอบ')+' '+q.n.unit:'ไม่มีข้อคำนวณ'} · คำตอบอธิบาย: ${esc(q.q.opts[a.q]??'ยังไม่ตอบ')}</p><p>จำนวนครั้งตอบผิด: ${data.tries[q.id]||0}</p><p><b>สิ่งที่ค้นพบ:</b></p><p style="white-space:pre-wrap">${esc(data.notes[q.id]||'ยังไม่บันทึก')}</p>${logs.length?`<table><tr><th>ครั้ง</th><th>ค่าที่ตั้ง</th><th>ผลอ่าน</th></tr>${logs.map((l,i)=>`<tr><td>${i+1}</td><td>${q.controls.map(c=>esc(c.label)+': '+esc(c.options?c.options[l.s[c.key]]:l.s[c.key]+' '+c.unit)).join('<br>')}</td><td>${l.values.map(([k,v])=>esc(k)+': '+esc(v)).join('<br>')}</td></tr>`).join('')}</table>`:'<p>ยังไม่มีหลักฐานการทดลอง</p>'}</section>`}}return `<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายงาน SONIC QUEST</title><style>body{font:16px/1.7 Tahoma,sans-serif;max-width:960px;margin:35px auto;padding:20px;color:#142539}h1{font-size:28px}h2{border-bottom:2px solid #348777;margin-top:32px}section{margin:25px 0;padding:18px;border:1px solid #ccd5dd;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:8px;border:1px solid #ccd5dd;text-align:left;vertical-align:top}@media print{section{break-inside:avoid}body{margin:0}}</style>${h}</html>`}
function exportReport(){stash();download('SONIC_QUEST_report.html',reportHTML(),'text/html;charset=utf-8');toast('ดาวน์โหลดรายงานแล้ว เปิดเพื่ออ่านหรือสั่งพิมพ์เป็น PDF ได้')}
function showResults(){stash();const n=countDone(),complete=n===quests.length;modal(complete?'ภารกิจกู้เมืองสำเร็จ!':'รายงานความก้าวหน้า',`${complete?`<div class="certificate"><div class="celebrate">✦</div><span class="eyebrow">SONOVA RESTORED</span><h1>ผู้พิทักษ์เมืองโซโนวา</h1><p>${esc(data.name||'วิศวกรเสียง')}</p><p>สำเร็จครบ ${quests.length} ภารกิจ · ${score()} XP</p></div>`:`<h3>${esc(data.name||'วิศวกรเสียง')} · ${n}/${quests.length} ภารกิจ</h3><div class="progress"><div style="width:${n/quests.length*100}%"></div></div>`}<div class="row" style="margin:16px 0">${stages.map((st,i)=>finished(i)?`<span class="badge">✓ ${st.badge}</span>`:'').join('')}</div><table><tr><th>สถานี</th><th>สำเร็จ</th><th>XP</th></tr>${stages.map(st=>`<tr><td>${st.title}</td><td>${st.quests.filter(q=>data.done[q.id]).length}/${st.quests.length}</td><td>${st.quests.reduce((n,q)=>n+(data.done[q.id]?.score||0),0)}</td></tr>`).join('')}</table><p class="note">คะแนนแต่ละภารกิจสูงสุด 100 XP ลดครั้งละ 10 เมื่อส่งคำตอบผิด แต่ไม่ต่ำกว่า 60 XP การเล่นซ้ำไม่เพิ่มคะแนนซ้ำและไม่ลดคะแนนที่ได้รับแล้ว</p><div class="row"><button class="primary" onclick="exportReport()">ดาวน์โหลดรายงานส่งครู</button><button onclick="exportSave()">สำรองความก้าวหน้า</button><button onclick="$('importFile').click()">นำเข้าข้อมูล</button></div><details><summary>ชื่อผู้เล่นและเริ่มเกมใหม่</summary><label for="rename">ชื่อผู้เล่น/กลุ่ม</label><input id="rename" type="text" maxlength="80" value="${esc(data.name)}"><button class="small" style="margin-top:8px" onclick="data.name=$('rename').value.trim();save();showResults()">บันทึกชื่อ</button><p class="note">เริ่มใหม่จะลบความก้าวหน้าในเครื่องนี้ ควรสำรองก่อน</p><button class="small" onclick="resetGame()">เริ่มเกมใหม่</button></details>`)}
function resetGame(){if(!confirm('ลบความก้าวหน้าและเริ่มใหม่หรือไม่? หากต้องการเก็บผลเดิม ให้ยกเลิกแล้วส่งออกก่อน'))return;current=null;data=fresh();save();$('modal').close();goHome();toast('เริ่มเกมใหม่เรียบร้อย')}
function validImport(p){if(!p||p.version!==1||typeof p.name!=='string'||p.name.length>80)throw Error('รูปแบบข้อมูลไม่ตรงกับเกมนี้');const out=fresh();out.name=p.name;for(const k of ['done','logs','notes','tries','settings','answers'])if(!p[k]||typeof p[k]!=='object'||Array.isArray(p[k]))throw Error('ข้อมูลไม่ครบ');for(const q of quests){const id=q.id;if(p.done[id]){const d=p.done[id];if(!Number.isFinite(d.score)||d.score<60||d.score>100||typeof d.at!=='string')throw Error('คะแนนไม่ถูกต้อง');out.done[id]={score:d.score,at:d.at.slice(0,40)}}if(p.notes[id]!=null){if(typeof p.notes[id]!=='string'||p.notes[id].length>2000)throw Error('บันทึกไม่ถูกต้อง');out.notes[id]=p.notes[id]}if(p.tries[id]!=null){if(!Number.isInteger(p.tries[id])||p.tries[id]<0||p.tries[id]>100000)throw Error('จำนวนครั้งไม่ถูกต้อง');out.tries[id]=p.tries[id]}const validateSettings=s=>{if(!s||typeof s!=='object')throw Error('ค่าทดลองไม่ครบ');const o={};for(const c of q.controls){const v=s[c.key];if(!Number.isFinite(v)||(c.options?(!Number.isInteger(v)||v<0||v>=c.options.length):(v<c.min||v>c.max)))throw Error('ค่าทดลองอยู่นอกขอบเขต');o[c.key]=v}return o};if(p.settings[id])out.settings[id]=validateSettings(p.settings[id]);if(p.logs[id]){if(!Array.isArray(p.logs[id])||p.logs[id].length>60)throw Error('ตารางทดลองผิดรูปแบบ');out.logs[id]=p.logs[id].map(l=>{const s=validateSettings(l.s);return{s,at:typeof l.at==='string'?l.at.slice(0,40):'',values:readings(q,s)}})}if(p.answers[id]){const a=p.answers[id];out.answers[id]={};if(a.n!==undefined){if(typeof a.n!=='string'||a.n.length>100)throw Error('คำตอบตัวเลขผิดรูปแบบ');out.answers[id].n=a.n}if(a.q!==undefined){if(!Number.isInteger(a.q)||a.q<0||a.q>=q.q.opts.length)throw Error('ตัวเลือกผิดรูปแบบ');out.answers[id].q=a.q}}}return out}
$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('ไฟล์ใหญ่เกิน 2 MB');const imported=validImport(JSON.parse(await f.text()));if(!confirm('ใช้ความก้าวหน้าจากไฟล์นี้แทนข้อมูลปัจจุบันหรือไม่?'))return;current=null;data=imported;save();$('modal').close();goHome();toast('นำเข้าความก้าวหน้าสำเร็จ')}catch(err){toast('นำเข้าไม่ได้: '+err.message)}finally{e.target.value=''}});
document.addEventListener('input',e=>{if(current&&(e.target.id==='reflection'||e.target.id==='numeric'||e.target.name==='choice'))stash()});
window.addEventListener('beforeunload',stash);$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close()}});
goHome();if(!storageOK)$('saveState').textContent='ใช้ส่งออกเพื่อบันทึก';requestAnimationFrame(animate);
</script></body></html>
